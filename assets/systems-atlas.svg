<svg width="1280" height="370" viewBox="0 0 1280 370" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Yash Pathak systems atlas</title>
  <desc id="desc">A dark systems map connecting BreachWatch, CipherLink, and FrameTrace through detect, protect, and prove.</desc>
  <defs>
    <linearGradient id="atlas-bg" x1="0" y1="0" x2="1280" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08131B"/>
      <stop offset="0.5" stop-color="#101A2B"/>
      <stop offset="1" stop-color="#161329"/>
    </linearGradient>
    <linearGradient id="atlas-line" x1="120" y1="190" x2="1160" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55F2C4"/>
      <stop offset="0.5" stop-color="#70D9FF"/>
      <stop offset="1" stop-color="#BD8DFF"/>
    </linearGradient>
    <linearGradient id="card-a" x1="48" y1="70" x2="390" y2="306" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142E31"/>
      <stop offset="1" stop-color="#0E2028"/>
    </linearGradient>
    <linearGradient id="card-b" x1="469" y1="70" x2="811" y2="306" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172A38"/>
      <stop offset="1" stop-color="#131C31"/>
    </linearGradient>
    <linearGradient id="card-c" x1="890" y1="70" x2="1232" y2="306" gradientUnits="userSpaceOnUse">
      <stop stop-color="#211C3A"/>
      <stop offset="1" stop-color="#17172C"/>
    </linearGradient>
    <pattern id="atlas-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#A5DCD7" stroke-opacity="0.07"/>
    </pattern>
    <filter id="atlas-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1280" height="370" rx="24" fill="url(#atlas-bg)"/>
  <rect x="1" y="1" width="1278" height="368" rx="23" fill="url(#atlas-grid)"/>
  <rect x="1" y="1" width="1278" height="368" rx="23" stroke="#A7EDE0" stroke-opacity="0.16"/>

  <text x="48" y="40" fill="#78989F" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="3">SYSTEMS ATLAS / ONE DESIGN INSTINCT</text>
  <path d="M48 192H1232" stroke="url(#atlas-line)" stroke-opacity="0.2" stroke-width="12" filter="url(#atlas-glow)"/>
  <path d="M48 192H1232" stroke="url(#atlas-line)" stroke-opacity="0.7" stroke-width="2"/>

  <g>
    <rect x="48" y="72" width="342" height="236" rx="16" fill="url(#card-a)" stroke="#55F2C4" stroke-opacity="0.45"/>
    <circle cx="76" cy="101" r="6" fill="#55F2C4"/>
    <text x="94" y="106" fill="#55F2C4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="2">01 / DETECT</text>
    <text x="76" y="163" fill="#F1FBF7" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">BreachWatch</text>
    <text x="76" y="193" fill="#A6C5C4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">raw events → alert context</text>
    <path d="M76 226H350" stroke="#55F2C4" stroke-opacity="0.3"/>
    <text x="76" y="254" fill="#7EA8A9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">signal / correlation / audit</text>
    <text x="76" y="280" fill="#55F2C4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1">MAKE THE ALERT EXPLAINABLE</text>
  </g>

  <g>
    <rect x="469" y="72" width="342" height="236" rx="16" fill="url(#card-b)" stroke="#70D9FF" stroke-opacity="0.45"/>
    <circle cx="497" cy="101" r="6" fill="#70D9FF"/>
    <text x="515" y="106" fill="#70D9FF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="2">02 / PROTECT</text>
    <text x="497" y="163" fill="#F1FBF7" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">CipherLink</text>
    <text x="497" y="193" fill="#A6C5C4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">private payload → control</text>
    <path d="M497 226H771" stroke="#70D9FF" stroke-opacity="0.3"/>
    <text x="497" y="254" fill="#7EA8A9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">key wrap / expiry / revoke</text>
    <text x="497" y="280" fill="#70D9FF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1">MAKE THE BOUNDARY REVERSIBLE</text>
  </g>

  <g>
    <rect x="890" y="72" width="342" height="236" rx="16" fill="url(#card-c)" stroke="#BD8DFF" stroke-opacity="0.45"/>
    <circle cx="918" cy="101" r="6" fill="#BD8DFF"/>
    <text x="936" y="106" fill="#BD8DFF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="2">03 / PROVE</text>
    <text x="918" y="163" fill="#F1FBF7" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">FrameTrace</text>
    <text x="918" y="193" fill="#A6C5C4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">media input → evidence</text>
    <path d="M918 226H1192" stroke="#BD8DFF" stroke-opacity="0.3"/>
    <text x="918" y="254" fill="#7EA8A9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">signals / job states / limits</text>
    <text x="918" y="280" fill="#BD8DFF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1">MAKE THE REPORT HONEST</text>
  </g>

  <circle cx="390" cy="192" r="5" fill="#55F2C4"/>
  <circle cx="469" cy="192" r="5" fill="#70D9FF"/>
  <circle cx="811" cy="192" r="5" fill="#70D9FF"/>
  <circle cx="890" cy="192" r="5" fill="#BD8DFF"/>
  <text x="48" y="342" fill="#6F9098" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="2">RAW SIGNAL  →  EXPLICIT BOUNDARY  →  USABLE EVIDENCE</text>
</svg>
