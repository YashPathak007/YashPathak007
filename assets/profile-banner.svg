<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Yash Pathak — systems lab</title>
  <desc id="desc">A futuristic terminal-inspired banner for Yash Pathak, a security-minded product engineer building explainable systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060F17"/>
      <stop offset="0.52" stop-color="#0B2027"/>
      <stop offset="1" stop-color="#15132B"/>
    </linearGradient>
    <linearGradient id="glow" x1="78" y1="42" x2="1192" y2="348" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55F2C4"/>
      <stop offset="0.5" stop-color="#70D9FF"/>
      <stop offset="1" stop-color="#BD8DFF"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#9BD8D0" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
