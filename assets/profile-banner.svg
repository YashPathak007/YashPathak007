  <text x="58" y="174" fill="#F3FBF8" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" letter-spacing="-2">BUILD SYSTEMS</text>
  <text x="58" y="232" fill="url(#glow)" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" letter-spacing="-2">THAT EXPLAIN THEMSELVES.</text>
  <text x="60" y="282" fill="#A8C1C2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" letter-spacing="1">security operations  ·  private exchange  ·  media evidence</text>
