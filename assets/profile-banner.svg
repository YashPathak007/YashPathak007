<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Yash Pathak — software systems</title>
  <desc id="desc">A futuristic terminal-inspired banner with a systems engineering message.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071018"/>
      <stop offset="0.52" stop-color="#0C1D25"/>
      <stop offset="1" stop-color="#101329"/>
    </linearGradient>
    <linearGradient id="glow" x1="80" y1="30" x2="1170" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54F1C4"/>
      <stop offset="0.5" stop-color="#73D7FF"/>
      <stop offset="1" stop-color="#B28CFF"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#9BD8D0" stroke-opacity="0.08"/>
